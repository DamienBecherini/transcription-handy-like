services:
  transcription:
    build: .
    image: transcription-handy-like:local
    restart: unless-stopped
    mem_limit: ${TRANSCRIPTION_MEMORY:-4g}
    ports:
      - "${TRANSCRIPTION_HOST:-127.0.0.1}:${TRANSCRIPTION_PORT:-8000}:8000"
    environment:
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_THREADS: ${TRANSCRIPTION_THREADS:-0}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-}
    volumes:
      - ${TRANSCRIPTION_MODELS:-models}:/models

volumes:
  models:
